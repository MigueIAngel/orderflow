name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  python-services:
    name: ${{ matrix.service }} (Python)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [inventory, payments]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  node-services:
    name: ${{ matrix.service }} (Node)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [orders, notifications, gateway]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/${{ matrix.service }}/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx prettier --check "src/**/*.ts" "test/**/*.ts"
      - run: npm run build
      - run: npm test
      - if: matrix.service == 'orders'
        run: npm run test:e2e

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  saga-e2e:
    name: Saga end-to-end (Docker Compose)
    runs-on: ubuntu-latest
    needs: [python-services, node-services, web]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build --wait postgres redis
      - run: docker compose up -d --build
      - run: scripts/smoke-test.sh http://localhost:3000
      - name: Service logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200

  demo-image:
    name: Single-container demo image
    runs-on: ubuntu-latest
    needs: [python-services, node-services]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f deploy/demo/Dockerfile -t orderflow-demo .
      - run: docker run -d --name demo -m 512m -p 10000:10000 orderflow-demo
      - run: scripts/smoke-test.sh http://localhost:10000
      - if: failure()
        run: docker logs demo
